[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b2b-distribution-agent"
version = "0.1.0"
description = "B2B distribution automation MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pymysql>=1.1,<2",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "openpyxl>=3.1,<4",
  "httpx>=0.27,<1",
  "alembic>=1.13,<2",
  "celery[redis]>=5.4,<6",
  "PyJWT>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-dotenv>=1.0,<2",
  "reportlab>=4.2,<5",
  "wecom-aibot-python-sdk==1.0.2",
  "cryptography>=43,<47",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]
